<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chat</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #eee;
    font-family: "VT323";
  }

  .chat {
    max-width: 150px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }

  .chat h1 {
    font-family: "VT323", "Courier New", monospace;
    color: #094293;
    font-size: 24px;
    text-align: center;
    margin-bottom: 15px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
  }

  .msg {
    margin-bottom: 12px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 85%;
    word-wrap: break-word;
  }

  .msg.user {
    margin-left: auto;
    text-align: right;
    color: #aaa;
  }

  .msg.bot {
    color: #094293;
  }

  .msg.typing {
    color: #666;
  }

  .msg img {
    display: block;
    max-width: 100%;
    margin-top: 6px;
  }

  #chat-form {
    display: flex;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid #333;
  }

  #chat-input {
    flex: 1;
    padding: 10px;
    background: #000;
    border: 1px solid #444;
    color: #eee;
    font-family: monospace;
    font-size: 14px;
  }

  #chat-input:focus {
    outline: none;
    border-color: #094293;
  }

  #chat-form button {
    padding: 10px 16px;
    background: ##094293;
    border: none;
    color: #000;
    font-family: "VT323";
    font-weight: bold;
    cursor: pointer;
  }

  #chat-form button:hover {
    background: #ff6fbb;
  }
   #static {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.08;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="static"></canvas>
  <div class="chat">
    <h1>Base de Datos Interactiva de la asosiación de Jujutsu</h1>
    <div id="messages"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="escribe algo..." autocomplete="off">
      <button type="submit">&gt;</button>
    </form>
  </div>

  <script>
    // =====================================================
    //  EDITA AQUÍ: palabras clave y respuestas
    //  - "keywords": si el mensaje contiene CUALQUIERA de estas palabras, responde.
    //  - "replies": respuestas posibles (elige una al azar). Puedes poner solo una.
    //  - Se ignoran mayúsculas y acentos ("Sueño" = "sueno").
    //  - Se revisan en orden: la primera que coincida gana.
    // =====================================================
    const RULES = [
      {
        keywords: ["hola", "hey", "buenas"],
        replies: [ "Hola, esta es la base de datos interactiva, escribe el nombre de aquello que quieras saber"]
      },
      {
        keywords: ["quien eres", "quien eres tu", "nombre"],
        replies: ["no deberias hacer preguntas de las que no quieres la respuesta"]
      },
      {
        keywords: ["sueno", "dormir", "dreaming"],
        replies: ["ella se quedó durmiendo, aun no lo saben", "abran los ojos"]
      },
      {
        keywords: ["ojo", "eye"],
        replies: [{ text: "ella te está mirando.", image: "acceptyourfate.webp" }]
      },
     {
        keywords: ["Takashi", "Takashi Tsurui", "Tsurui Takashi"],
        replies: ["Es el hechicero más poderoso de la actualidad, retomó el titulo de grado especial despues de que le fue conferido a Aiku Zen'in en 1958, posee la tecnica innata del clan Tsurui, ahora mismo se encuentra como profesor de Tokyo Jujutsu High. Se dice que posee mas de mil maldiciones a su poder, entre ellos multiples maldiciones de grado especial. Se desconoce que ocurriria en el caso de que quede incapacitado"]
      },
      {
        keywords: ["Nyoirin", "Codicia"],
        replies: ["You will remember how Prometheus the Titan made man out of clay and helped his cousin Zeus to win the war of rebellion against Cronus. One would think that he might have won Zeus’s undying thanks, but unfortunately for Prometheus, he presumed too much on Zeus’s gratitude. As a result he made Zeus angry and had to suffer severe punishment. Prometheus was very please with man but felt that there was a great deal left to be desired in his creation. His brother, Epimetheus, whose name means “he who thinks afterward,” had had a hand in helping make man; but true to his name, he had used up all his raw materials in giving man just a body more versatile than that of the animals. Prometheus realized that in this state man would not know how to take advantage of his upright posture. What man needed, he saw, was to have the chance to develop his mind. Athene, the goddess of wisdom, had already given Prometheus the knowledge of how to build houses, to add and subtract, to chart a course by the stars, to heal illness, and these, and many other useful arts, he soon passed on to mankind. But still man did not have enough to satisfy Prometheus. So he decided to give man the divine gift of fire. At first Zeus did not seem to object to this idea. But trouble came when Prometheus played a joke on Zeus. It began one day when the gods were gathered together to decide which portions of the sacrificial bull should be offered to them as a gift. Since he was the most clever god, Prometheus was asked to make the decision. “Well,” he said, thinking to show them how silly they were to argue over such a matter, “give me an hour or two and I will have an answer for you.” So while the gods went off for a noontime nap, Prometheus took a bull, killed it, dismembered it, and flayed its hide. Then he made two bags from the hide. Into one he stuffed all the flesh of the bull; and on top of the flesh, at the mouth of the bag; he stuffed the bull’s stomach, the least tempting part of the animal. Into the other bag, he put first the bones and then on top, at the mouth of the bag, he placed the animal’s juicy fat. When the gods returned in the early afternoon, they saw the two bags placed on a large flat stone. “Now,” said Prometheus craftily, “I’ve decided that the best way to resolve the argument is to let Zeus be guided by what he sees. Let the father of the gods and men choose which of these two bags he most would like. Whatever the bag contains shall hereafter be the portion of sacrifice given the gods.” Zeus was pleased at the idea and quickly stepped up to inspect the bags."]
      },
     {
        keywords: ["Haru Gojo", "Haru"],
        replies: ["Haru Gojo es el hechicero de primer año de Tokyo High, posee la tecnica del Infinito y el razgo genetico de los seis ojos, ahora mismo se encuentra en una misión de intercambio viajando por toda America", "pronto acabare con esa molestia"]
      },
     {
        keywords: ["Lucas Diaz", "Lucas"],
        replies: ["Lucas Diaz es el hechicero más fuerte de la Republica Argentina, con solo 17 años posee un potencial para llegar al tan impresionante grado especial, ahora mismo se encuentra en una beca de intercambio en Tokyo Jujutsu High", "me recuerda a Aiku Zen'in"]
      },
    ];

    // Respuesta si no coincide ninguna palabra clave
    const DEFAULT_REPLIES = [
      "no entiendo.",
      "...",
      "repite eso."
    ];

    // Mensaje inicial (déjalo vacío "" si no quieres ninguno)
    const FIRST_MESSAGE = "";

    // Milisegundos que "tarda en escribir" antes de responder
    const REPLY_DELAY = 900;
    // =====================================================

    const messages = document.getElementById('messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');

    function normalize(text) {
      return text
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    function addMessage(content, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;

      if (typeof content === 'object') {
        if (content.text) {
          const t = document.createElement('div');
          t.textContent = content.text;
          div.appendChild(t);
        }
        if (content.image) {
          const img = document.createElement('img');
          img.src = content.image;
          img.alt = '';
          img.onload = () => { messages.scrollTop = messages.scrollHeight; };
          div.appendChild(img);
        }
      } else {
        div.textContent = content;
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function getReply(userText) {
      const clean = normalize(userText);
      for (const rule of RULES) {
        for (const kw of rule.keywords) {
          if (clean.includes(normalize(kw))) {
            return pick(rule.replies);
          }
        }
      }
      return pick(DEFAULT_REPLIES);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const typing = addMessage('...', 'bot typing');
      setTimeout(() => {
        typing.remove();
        addMessage(getReply(text), 'bot');
      }, REPLY_DELAY);
    });

    if (FIRST_MESSAGE) addMessage(FIRST_MESSAGE, 'bot');
  </script>
<script>
  (function () {
    var c = document.getElementById('static');
    var ctx = c.getContext('2d');
    c.width = 200;
    c.height = 200;
    var img = ctx.createImageData(200, 200);

    function draw() {
      var d = img.data;
      for (var i = 0; i < d.length; i += 4) {
        var v = Math.random() * 255;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }

    draw();
    setInterval(draw, 70);
  })();
</script>
</body>
</html>
