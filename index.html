<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
  }

  .login-box {
    width: 300px;
    padding: 30px;
    background: #0a0a0a;
    border: 1px solid #333;
  }

  .login-box h1 {
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    color: #ff3fa4;
    font-size: 24px;
    text-align: center;
    margin-bottom: 25px;
  }

  .login-box input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    background: #000;
    border: 1px solid #444;
    color: #eee;
    font-family: monospace;
    font-size: 14px;
  }

  .login-box input:focus {
    outline: none;
    border-color: #ff3fa4;
  }

  .login-box button {
    width: 100%;
    padding: 10px;
    background: #ff3fa4;
    border: none;
    color: #000;
    font-family: monospace;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
  }

  .login-box button:hover {
    background: #ff6fbb;
  }

  #error-msg {
    color: #ff3f3f;
    font-size: 12px;
    text-align: center;
    margin-top: 12px;
    min-height: 14px;
  }
</style>
</head>
<body>

  <div class="login-box">
    <h1>Log In</h1>
    <form id="login-form">
      <input type="text" id="username" placeholder="usuario" autocomplete="off">
      <input type="password" id="password" placeholder="clave" autocomplete="off">
      <button type="submit">Entrar</button>
      <div id="error-msg"></div>
    </form>
  </div>

  <script>
    var USUARIO = "dreaming";
    var CLAVE = "BSST";
    var DESTINO = "chat.html";

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();

      var user = document.getElementById('username').value.trim().toLowerCase();
      var pass = document.getElementById('password').value;

      if (user === USUARIO && pass === CLAVE) {
        window.location.href = DESTINO;
      } else {
        document.getElementById('error-msg').textContent = "usuario o clave incorrectos";
        document.getElementById('password').value = "";
      }
    });
  </script>

</body>
</html>
