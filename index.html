<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
  }

  .login-box {
    width: 300px;
    padding: 30px;
    background: #0a0a0a;
    border: 1px solid #333;
  }

  .login-box h1 {
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    color: #ff3fa4;
    font-size: 24px;
    text-align: center;
    margin-bottom: 25px;
  }

  .login-box input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    background: #000;
    border: 1px solid #444;
    color: #eee;
    font-family: monospace;
    font-size: 14px;
  }

  .login-box input:focus {
    outline: none;
    border-color: #ff3fa4;
  }

  .login-box button {
    width: 100%;
    padding: 10px;
    background: #ff3fa4;
    border: none;
    color: #000;
    font-family: monospace;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
  }

  .login-box button:hover {
    background: #ff6fbb;
  }

  #error-msg {
    color: #ff3f3f;
    font-size: 12px;
    text-align: center;
    margin-top: 12px;
    min-height: 14px;
  }
</style>
</head>
<body>

  <div class="login-box">
    <h1>Iniciar Sesión</h1>
    <form id="login-form">
      <input type="text" id="username" placeholder="usuario" autocomplete="off">
      <input type="password" id="password" placeholder="clave" autocomplete="off">
      <button type="submit">Entrar</button>
      <div id="error-msg"></div>
    </form>
  </div>

  <script>
    // ---- EDITA ESTOS DOS VALORES CON TU USUARIO Y CLAVE ----
    const VALID_USERNAME = "Ai Ijichi";
    const VALID_PASSWORD = "04202002";
    // ----------------------------------------------------------
    // A dónde te lleva si el usuario/clave son correctos
    const REDIRECT_TO = "blog.html";

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      if (user === VALID_USERNAME && pass === VALID_PASSWORD) {
        window.location.href = REDIRECT_TO;
      } else {
        errorMsg.textContent = "usuario o clave incorrectos";
        document.getElementById('password').value = "";
      }
    });
  </script>

</body>
</html>
